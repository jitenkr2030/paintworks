{% extends "base.html" %}
{% block title %}403 – Access Denied{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="display-1 text-warning">403</div>
    <h3 class="mt-3">Access Denied</h3>
    <p class="text-muted">You don't have permission to access this page. Please contact your administrator if you believe this is an error.</p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary">
      <i class="bi bi-house"></i> Go to Dashboard
    </a>
  </div>
</div>
{% endblock %}
