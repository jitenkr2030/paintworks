{% extends "base.html" %}
{% block title %}Add Property – {{ PLATFORM_NAME }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header"><i class="bi bi-building-add"></i> Add Property for {{ customer.name }}</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.help_text %}<div class="form-text small">{{ field.help_text }}</div>{% endif %}
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Property</button>
          <a href="{% url 'crm:customer_detail' customer.pk %}" class="btn btn-link">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
